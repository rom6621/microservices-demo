version: "3"

vars:
  PROTO_DIR: ../../protos
  OUT_DIR: ./genproto

tasks:
  genproto:
    desc: Generate Go code from demo.proto
    sources:
      - "{{.PROTO_DIR}}/demo.proto"
    generates:
      - "{{.OUT_DIR}}/demo.pb.go"
      - "{{.OUT_DIR}}/demo_grpc.pb.go"
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - >
        protoc
        --proto_path={{.PROTO_DIR}}
        --go_out={{.OUT_DIR}} --go_opt=paths=source_relative
        --go-grpc_out={{.OUT_DIR}} --go-grpc_opt=paths=source_relative
        {{.PROTO_DIR}}/demo.proto
